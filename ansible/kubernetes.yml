---
- name: Install and Configure Kubernetes on EC2
  hosts: web
  become: yes

  tasks:

    - name: Install required packages
      shell: |
        yum install -y curl conntrack socat

    - name: Load br_netfilter module
      shell: modprobe br_netfilter

    - name: Configure Kubernetes sysctl settings
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: Apply sysctl settings
      shell: sysctl --system

    - name: Disable swap
      shell: |
        swapoff -a
        sed -i '/ swap /d' /etc/fstab

    - name: Create Kubernetes repository
      copy:
        dest: /etc/yum.repos.d/kubernetes.repo
        content: |
          [kubernetes]
          name=Kubernetes
          baseurl=https://pkgs.k8s.io/core:/stable:/v1.28/rpm/
          enabled=1
          gpgcheck=0

    - name: Install Kubernetes packages
      shell: |
        yum install -y kubelet kubeadm kubectl

    - name: Enable containerd
      systemd:
        name: containerd
        enabled: yes
        state: started

    - name: Enable and start kubelet
      systemd:
        name: kubelet
        enabled: yes
        state: started

    - name: Initialize Kubernetes cluster
      shell: kubeadm init --pod-network-cidr=192.168.0.0/16
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Create .kube directory
      file:
        path: /home/ec2-user/.kube
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'

    - name: Copy Kubernetes admin config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ec2-user/.kube/config
        remote_src: yes
        owner: ec2-user
        group: ec2-user
        mode: '0644'

    - name: Install Calico network plugin
      become_user: ec2-user
      shell: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.27.4/manifests/calico.yaml
      environment:
        KUBECONFIG: /home/ec2-user/.kube/config

    - name: Wait for Kubernetes node to become Ready
      become_user: ec2-user
      shell: kubectl wait --for=condition=Ready node --all --timeout=300s
      environment:
        KUBECONFIG: /home/ec2-user/.kube/config

    - name: Remove control-plane taint for single-node cluster
      become_user: ec2-user
      shell: kubectl taint nodes --all node-role.kubernetes.io/control-plane- || true
      environment:
        KUBECONFIG: /home/ec2-user/.kube/config